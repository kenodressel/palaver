name: Release dry run

# Builds and smoke-installs the release assets; publishes nothing. A release
# is signed with the kept certificate, which only the maintainer's Mac has:
# it is made there (make release, make publish; CONTRIBUTING.md, "Signing releases").
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --python 3.13 --extra dev

      - name: Build the echo-cancellation library
        run: make aec

      - name: Note the Swift toolchain
        # Part of the cache key: a new Xcode on the runner must not restore a stale .build.
        run: echo "SWIFT_TOOLCHAIN=$(swift --version 2>&1 | head -1 | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_ENV"

      - name: Cache the Swift engine's build
        # Keyed on what decides the build: the Makefile (FluidAudio's tag),
        # the package, and the scripts that fetch and patch FluidAudio.
        uses: actions/cache@v4
        with:
          path: |
            native/vendor
            native/.build
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN }}-${{ hashFiles('Makefile', 'native/Package.swift', 'tools/fetch_nemo.sh', 'tools/patch_fluidaudio.py') }}

      - name: Build the Swift engine
        run: make engine

      - name: Install WebKit for the end-to-end tests
        run: uv run --extra dev python -m playwright install webkit

      - name: Run tests
        run: make test

      - name: Pack the hosted models
        # pyannote's copy, from Hugging Face: its repo is gated, so only
        # this step gets the HF_TOKEN secret.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make models

      - name: Metal toolchain (MLX's shaders in palaver-lm)
        # make lm compiles them with xcodebuild; newer Xcodes ship the Metal compiler as a separate download.
        run: xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build release assets
        # The same recipe as on a Mac (#60): the app (the Swift programs,
        # no Python), the placeholder runtime the updaters before 0.6 need,
        # manifest.json, install.sh.
        run: make release

      - name: Smoke-install the assets
        # install.sh into a throwaway HOME under sandbox-exec, exactly as
        # users run it; no Python anywhere, updates with install.sh and the
        # Swift updater, and from 0.3.14 and 0.5.0rc6 with their own.
        run: make smoke-install
