name: Release

on:
  push:
    tags:
      - "v*"
  # Build-only dry run: builds and smoke-installs the assets without
  # publishing anything. The publish step below is gated on an actual tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_FROZEN: "1"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set version from tag
        # A dry run has no tag; it builds the version in __init__.py as is.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" palaver/__init__.py
          grep -q "^__version__ = \"$VERSION\"" palaver/__init__.py \
            || { echo "✗ Failed to set version in palaver/__init__.py"; exit 1; }
          echo "✓ Version set to $VERSION"

      - name: Install dependencies
        run: uv sync --python 3.13 --extra dev

      - name: Run tests
        run: make test

      - name: Pack the hosted models
        # pyannote's copy, from Hugging Face: its repo is gated, so only
        # this step gets the HF_TOKEN secret.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make models

      - name: Build release assets
        # The same recipe as on a Mac (#60): the app (with the wheel's code
        # and the AEC library), the runtime (python-build-standalone + the
        # lock), the models packed above, manifest.json, install.sh.
        run: make release

      - name: Smoke-install the assets
        # install.sh into a throwaway HOME under sandbox-exec, exactly as
        # users run it; imports, pyannote without a token, two updates
        # without the runtime.
        run: make smoke-install

      - name: Create GitHub Release
        # Only on a real tag — every v* tag becomes the "latest" release that
        # install.sh serves.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Everything built; a runtime or model unchanged since the last
          # release is uploaded again here (CI has no previous build to keep).
          files: |
            dist/palaver-app-*.zip
            dist/palaver-runtime-*.tar.*
            dist/palaver-models-*.tar
            dist/manifest.json
            dist/install.sh
          generate_release_notes: true
