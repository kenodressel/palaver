# The usage numbers' Worker (stats/, #6): tested, then deployed to Cloudflare whenever stats/ changes on master, so
# the public page never waits for a deploy by hand. The data needs none: the page is made from the database at each
# visit. Deploying needs the repository secrets CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers" and D1
# edit for the account) and CLOUDFLARE_ACCOUNT_ID; without them the Worker is only tested. The SALT secret lives in
# the Worker, never here.
name: stats

on:
  push:
    branches: [master]
    paths: ["stats/**", ".github/workflows/stats.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stats
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the Worker
        run: node --test
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: the Worker was tested, not deployed"
            exit 0
          fi
          npx --yes wrangler@4.156.0 deploy
