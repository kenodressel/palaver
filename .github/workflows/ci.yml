name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Never re-resolve in CI: the suite runs against exactly what uv.lock says.
  UV_FROZEN: "1"

jobs:
  test:
    runs-on: macos-15  # Apple Silicon; the app needs macOS 15+
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no major tags since v8 — pin the exact release.
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --python 3.13 --extra dev

      - name: Build the echo-cancellation library
        run: make aec

      - name: Note the Swift toolchain
        # Part of the cache key: a new Xcode on the runner must not restore a stale .build.
        run: echo "SWIFT_TOOLCHAIN=$(swift --version 2>&1 | head -1 | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_ENV"

      - name: Cache the Swift engine's build
        # Keyed on what decides the build: the Makefile (FluidAudio's tag),
        # the package, and the scripts that fetch and patch FluidAudio.
        uses: actions/cache@v4
        with:
          path: |
            native/vendor
            native/.build
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN }}-${{ hashFiles('Makefile', 'native/Package.swift', 'tools/fetch_nemo.sh', 'tools/patch_fluidaudio.py') }}

      - name: Build the Swift engine
        run: make engine

      - name: Run the engine once
        # The suite uses a fake engine; this proves the built binary starts and answers.
        run: printf '{"id":1,"cmd":"hello"}\n' | native/.build/release/palaver-engine --version ci | grep -q '"ok":true'

      - name: Install WebKit for the end-to-end tests
        # tests/e2e drive the Meetings window's page in Playwright's WebKit.
        run: uv run --extra dev python -m playwright install webkit

      - name: Run tests
        run: make test
