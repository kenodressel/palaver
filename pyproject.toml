# Palaver is a Swift app (native/). This project is only its developer tooling: the end-to-end tests
# (tests/e2e, Playwright), the release build (tools/build_release.py, tools/app_bundle.py), the tests of
# install.sh and the release assets, and the local engine gate (tools/eval_engine.py). Nothing here ships.
# The app's version is VERSION.
[project]
name = "palaver-dev"
version = "0"
description = "Developer tooling of Palaver (tests, release build); the app itself is Swift"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.8.0",
    "playwright>=1.48",
    # The e2e tests' synthetic recordings and the Swift tests' Opus check (soundfile reads what Swift wrote).
    "numpy>=1.24",
    "soundfile>=0.12",
    # An image in the e2e tests (my notes).
    "pillow",
    # tools/eval_engine.py: the speaker mapping of the confusion score.
    "scipy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "integration: hits real models or external services; default-skip",
    "e2e: drives the Meetings window in Playwright's WebKit; skipped when WebKit is not installed",
]
addopts = "-m 'not integration' -p pytester"
