# Palaver's opt-in usage numbers (#6). Deploy steps: README.md in this folder.
name = "palaver-stats"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "palaver-stats"
# The id `npx wrangler d1 create palaver-stats` prints.
database_id = "REPLACE-WITH-THE-DATABASE-ID"

# Once a day: the daily rows older than 90 days are deleted.
[triggers]
crons = ["17 3 * * *"]

# No request logs: they would hold IP addresses and user agents, which this Worker promises not to keep.
[observability]
enabled = false
